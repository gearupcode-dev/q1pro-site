<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q1 Professional Services LLC</title>
<style>
  :root { --bg:#f4f6f8; --card:#ffffff; --ink:#14212e; --muted:#5b6b7a; --line:#d9e0e6; --accent:#1d4e6b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10181f; --card:#17222b; --ink:#e8eef3; --muted:#9db0bf; --line:#2a3a47; --accent:#7fb4d1; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .block { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line);
           border-top:4px solid var(--accent); border-radius:6px; padding:40px 32px; text-align:center; }
  h1 { margin:0 0 8px; font-size:1.4rem; letter-spacing:.01em; }
  p { margin:0; color:var(--muted); line-height:1.5; }
  .status { margin-top:24px; display:inline-block; padding:6px 14px; border:1px solid var(--line);
            border-radius:999px; font-size:.85rem; color:var(--accent); }
</style>
</head>
<body>
  <main class="block">
    <h1>Q1 Professional Services LLC</h1>
    <p>Our website is coming soon.</p>
    <span class="status">Site under construction</span>
  </main>
</body>
</html>
